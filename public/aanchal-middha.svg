<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628" />
      <stop offset="50%" stop-color="#14243b" />
      <stop offset="100%" stop-color="#050d1a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4b87a" />
      <stop offset="50%" stop-color="#c9a96e" />
      <stop offset="100%" stop-color="#ab8945" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(201,169,110,0.3)" />
      <stop offset="100%" stop-color="rgba(201,169,110,0)" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="180" fill="url(#glow)" />

  <!-- Outer Ring -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8" />
  <circle cx="200" cy="200" r="186" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="6 6" opacity="0.4" />

  <!-- Stylized Founder Portrait Silhouette -->
  <g transform="translate(0, 20)">
    <!-- Shoulders -->
    <path d="M 100,320 C 100,240 140,225 200,225 C 260,225 300,240 300,320 Z" fill="url(#goldGrad)" opacity="0.85" />
    <!-- Neck -->
    <rect x="180" y="175" width="40" height="50" rx="8" fill="#d4b87a" opacity="0.9" />
    <!-- Head -->
    <circle cx="200" cy="140" r="55" fill="url(#goldGrad)" />
    <!-- Hair outline -->
    <path d="M 135,140 C 135,70 265,70 265,140 C 265,160 255,180 250,195 C 240,160 220,105 200,105 C 180,105 160,160 150,195 C 145,180 135,160 135,140 Z" fill="#0a1628" opacity="0.95" />
  </g>

  <!-- Initials Badge -->
  <circle cx="200" cy="325" r="28" fill="#050d1a" stroke="url(#goldGrad)" stroke-width="2" />
  <text x="200" y="333" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">AM</text>
</svg>
